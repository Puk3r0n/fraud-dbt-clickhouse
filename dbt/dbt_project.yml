name: fraud_dbt
version: "1.0.0"
config-version: 2
profile: fraud_dbt

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
seed-paths: ["seeds"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

vars:
  large_amount_threshold: 500
  suspicious_merchant_fraud_rate: 2.0
  suspicious_merchant_min_tx: 100

models:
  fraud_dbt:
    staging:
      +schema: staging
      +materialized: view
    marts:
      +schema: marts
      +materialized: table

seeds:
  fraud_dbt:
    +schema: seeds
    states:
      +column_types:
        state_code: String
        state_name: String
        region: String
